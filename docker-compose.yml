version: "3.9"

services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: vet2_app
    working_dir: /var/www/html/site
    volumes:
      - ./:/var/www/html
    environment:
      - PHP_MEMORY_LIMIT=512M
      - PHP_UPLOAD_LIMIT=32M
    networks:
      - vet2_net

  web:
    image: nginx:alpine
    container_name: vet2_web
    ports:
      - "80:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - vet2_net

  db:
    image: mysql:8.0
    container_name: vet2_db
    environment:
      - MYSQL_ROOT_PASSWORD=root
      - MYSQL_DATABASE=vet2
      - MYSQL_USER=vet2
      - MYSQL_PASSWORD=vet2
    ports:
      - "3306:3306"
    volumes:
      - vet2_db_data:/var/lib/mysql
    networks:
      - vet2_net

  mailhog:
    image: mailhog/mailhog:latest
    container_name: vet2_mailhog
    ports:
      - "8025:8025"
    networks:
      - vet2_net

networks:
  vet2_net: {}

volumes:
  vet2_db_data: {}
